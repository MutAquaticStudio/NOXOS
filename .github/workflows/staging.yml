name: staging

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check-frozen-inputs
        env:
          CANONICAL_CONTRACT_ROOT: ${{ vars.CANONICAL_CONTRACT_ROOT }}
          REQUIRE_EXTERNAL_CONTRACTS: "true"
      - run: pnpm db:migrate:staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      - run: pnpm deploy:staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - run: pnpm verify:staging
        env:
          NOX_STAGING_URL: ${{ vars.NOX_STAGING_URL }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
