name: staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nox-os-staging
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 30
    env:
      NOX_DEPLOY_ENV: staging
      NOX_ENV: staging
      NOX_SOURCE_SHA: ${{ github.sha }}
      VITE_NOX_ENV: staging
      VITE_NOX_SOURCE_SHA: ${{ github.sha }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: validate
        run: pnpm validate
      - id: security-scan
        run: pnpm secrets:scan
      - id: frozen-inputs
        run: pnpm contracts:check-frozen-inputs
      - id: staging-configuration
        run: pnpm verify:staging:configuration
        env:
          GITHUB_VAR__SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          GITHUB_VAR__SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          GITHUB_VAR__SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          GITHUB_VAR__SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          GITHUB_VAR__SUPABASE_STAGING_STORAGE_BUCKET: ${{ vars.SUPABASE_STAGING_STORAGE_BUCKET }}
          GITHUB_VAR__VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          GITHUB_VAR__VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          GITHUB_SECRET__NOX_RUNTIME_DATABASE_URL: ${{ secrets.NOX_RUNTIME_DATABASE_URL }}
          GITHUB_SECRET__NOX_WORKFLOW_DATABASE_URL: ${{ secrets.NOX_WORKFLOW_DATABASE_URL }}
          GITHUB_SECRET__SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SECRET__SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_SECRET__SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GITHUB_SECRET__VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_SECRET__VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GITHUB_SECRET__NOX_DIAGNOSTIC_PROBE_TOKEN: ${{ secrets.NOX_DIAGNOSTIC_PROBE_TOKEN }}
      - id: environment-isolation
        run: pnpm verify:environment-isolation
        env:
          NOX_EXPECTED_ENV: staging
          NOX_ISOLATION_MODE: CONNECTED_NON_PRODUCTION
          NOX_CURRENT_DATABASE_RESOURCE: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          NOX_PRODUCTION_DATABASE_RESOURCE: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          NOX_CURRENT_STORAGE_RESOURCE: ${{ vars.SUPABASE_STAGING_STORAGE_BUCKET }}
          SUPABASE_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STAGING_STORAGE_BUCKET }}
          NOX_RUNTIME_DATABASE_URL: ${{ secrets.NOX_RUNTIME_DATABASE_URL }}
          NOX_WORKFLOW_DATABASE_URL: ${{ secrets.NOX_WORKFLOW_DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - id: migration-apply
        run: pnpm db:migrate:cloud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          NOX_MIGRATION_ENV: staging
      - id: migration-status
        run: pnpm db:status:cloud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          NOX_MIGRATION_ENV: staging
      - id: storage-reconciliation
        run: pnpm infra:storage:apply
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STAGING_STORAGE_BUCKET }}
      - id: vercel-staging-environment
        run: pnpm infra:vercel-staging:reconcile
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - id: deploy
        run: |
          deployment_output="$(pnpm deploy:staging)"
          printf '%s\n' "$deployment_output"
          deployment_url="$(printf '%s\n' "$deployment_output" | sed -n 's/^STAGING_DEPLOY_URL=//p' | tail -n 1)"
          test -n "$deployment_url"
          echo "staging_url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          NOX_RUNTIME_DATABASE_URL: ${{ secrets.NOX_RUNTIME_DATABASE_URL }}
          NOX_WORKFLOW_DATABASE_URL: ${{ secrets.NOX_WORKFLOW_DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STAGING_STORAGE_BUCKET }}
          NOX_DIAGNOSTIC_PROBE_TOKEN: ${{ secrets.NOX_DIAGNOSTIC_PROBE_TOKEN }}
      - id: staging-http
        run: pnpm verify:staging
        env:
          NOX_STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - id: data-plane
        run: pnpm verify:staging:data-plane
        env:
          NOX_EXPECTED_ENV: staging
          NOX_ISOLATION_MODE: CONNECTED_NON_PRODUCTION
          NOX_CURRENT_DATABASE_RESOURCE: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          NOX_PRODUCTION_DATABASE_RESOURCE: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          NOX_CURRENT_STORAGE_RESOURCE: ${{ vars.SUPABASE_STAGING_STORAGE_BUCKET }}
          NOX_RUNTIME_DATABASE_URL: ${{ secrets.NOX_RUNTIME_DATABASE_URL }}
          NOX_WORKFLOW_DATABASE_URL: ${{ secrets.NOX_WORKFLOW_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STAGING_STORAGE_BUCKET }}
          NOX_DEPLOYMENT_URL: ${{ steps.deploy.outputs.staging_url }}
          NOX_DIAGNOSTIC_PROBE_TOKEN: ${{ secrets.NOX_DIAGNOSTIC_PROBE_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - id: browser-install
        run: pnpm exec playwright install --with-deps chromium
      - id: browser
        run: pnpm verify:staging:browser
        env:
          NOX_STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - id: g3-material-intelligence
        run: pnpm verify:staging:g3-material-intelligence
        env:
          NOX_EXPECTED_ENV: staging
          NOX_STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
          SUPABASE_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STAGING_STORAGE_BUCKET }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NOX_RUNTIME_DATABASE_URL: ${{ secrets.NOX_RUNTIME_DATABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          G3_VISUAL_CAPTURE_DIR: ${{ runner.temp }}/g3-visual
          G5_VISUAL_CAPTURE_DIR: ${{ runner.temp }}/g5-visual
          G6_VISUAL_CAPTURE_DIR: ${{ runner.temp }}/g6-visual
          G7_VISUAL_CAPTURE_DIR: ${{ runner.temp }}/g7-visual
          G8_VISUAL_CAPTURE_DIR: ${{ runner.temp }}/g8-visual
      - id: g3-evidence
        run: |
          artifact_path="$RUNNER_TEMP/g3-evidence/G3_STAGING_${GITHUB_SHA}.env"
          node scripts/evidence/write-g3-staging-evidence.mjs "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
        env:
          NOX_STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
      - name: Upload G3 exact-SHA Staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g3-staging-evidence-${{ github.sha }}
          path: ${{ steps.g3-evidence.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 365
      - name: Upload G3 Staging visual acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g3-staging-visual-${{ github.sha }}
          path: ${{ runner.temp }}/g3-visual
          if-no-files-found: error
          retention-days: 365
      - id: g4-evidence
        run: |
          artifact_path="$RUNNER_TEMP/g4-evidence/G4_STAGING_${GITHUB_SHA}.env"
          node scripts/evidence/write-g4-staging-evidence.mjs "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
        env:
          NOX_STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
      - name: Upload G4 exact-SHA Staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g4-staging-evidence-${{ github.sha }}
          path: ${{ steps.g4-evidence.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 365
      - id: g5-evidence
        run: |
          artifact_path="$RUNNER_TEMP/g5-evidence/G5_STAGING_${GITHUB_SHA}.env"
          node scripts/evidence/write-g5-staging-evidence.mjs "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
        env:
          NOX_STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
      - name: Upload G5 exact-SHA Staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g5-staging-evidence-${{ github.sha }}
          path: ${{ steps.g5-evidence.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 365
      - name: Upload G5 Staging visual acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g5-staging-visual-${{ github.sha }}
          path: ${{ runner.temp }}/g5-visual
          if-no-files-found: error
          retention-days: 365
      - id: g6-evidence
        run: |
          artifact_path="$RUNNER_TEMP/g6-evidence/G6_STAGING_${GITHUB_SHA}.env"
          node scripts/evidence/write-g6-staging-evidence.mjs "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
        env:
          NOX_STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
      - name: Upload G6 exact-SHA Staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g6-staging-evidence-${{ github.sha }}
          path: ${{ steps.g6-evidence.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 365
      - name: Upload G6 Staging visual acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g6-staging-visual-${{ github.sha }}
          path: ${{ runner.temp }}/g6-visual
          if-no-files-found: error
          retention-days: 365
      - id: g7-evidence
        run: |
          artifact_path="$RUNNER_TEMP/g7-evidence/G7_STAGING_${GITHUB_SHA}.env"
          node scripts/evidence/write-g7-staging-evidence.mjs "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
        env:
          NOX_STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
      - name: Upload G7 exact-SHA Staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g7-staging-evidence-${{ github.sha }}
          path: ${{ steps.g7-evidence.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 365
      - name: Upload G7 Staging visual acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g7-staging-visual-${{ github.sha }}
          path: ${{ runner.temp }}/g7-visual
          if-no-files-found: error
          retention-days: 365
      - id: g8-evidence
        run: |
          artifact_path="$RUNNER_TEMP/g8-evidence/G8_STAGING_${GITHUB_SHA}.env"
          node scripts/evidence/write-g8-staging-evidence.mjs "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
        env:
          NOX_STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
      - name: Upload G8 exact-SHA Staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g8-staging-evidence-${{ github.sha }}
          path: ${{ steps.g8-evidence.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 365
      - name: Upload G8 Staging visual acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g8-staging-visual-${{ github.sha }}
          path: ${{ runner.temp }}/g8-visual
          if-no-files-found: error
          retention-days: 365
      - id: g9-evidence
        run: |
          artifact_path="$RUNNER_TEMP/g9-evidence/G9_STAGING_${GITHUB_SHA}.env"
          node scripts/evidence/write-g9-staging-evidence.mjs "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
        env:
          NOX_STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
      - name: Upload G9 exact-SHA Staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g9-staging-evidence-${{ github.sha }}
          path: ${{ steps.g9-evidence.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 365
      - name: Record exact accepted Staging identity
        run: |
          echo "EXPECTED_STAGING_SHA=${GITHUB_SHA}"
          echo "DEPLOYED_STAGING_SHA=${GITHUB_SHA}"
