name: g11-acceptance-tag

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact accepted G11 main SHA from successful G11 Staging
        required: true
        type: string
      staging_evidence_run_id:
        description: Successful Staging run containing exact-SHA G11 evidence
        required: true
        type: string
      preview_evidence_run_id:
        description: Successful final PR Preview run containing G11 evidence
        required: true
        type: string
      pr_number:
        description: Merged Gate 11 pull request number
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: nox-os-g11-acceptance-tag
  cancel-in-progress: false

jobs:
  create-annotated-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      STAGING_EVIDENCE_RUN_ID: ${{ inputs.staging_evidence_run_id }}
      PREVIEW_EVIDENCE_RUN_ID: ${{ inputs.preview_evidence_run_id }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Validate immutable G11 Preview, Staging, and regression evidence
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STAGING_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PREVIEW_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]

          api() {
            curl -fsS \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          artifact_id() {
            printf '%s' "$1" | jq -r --arg name "$2" \
              '.artifacts[] | select(.name == $name and .expired == false) | .id' | head -n 1
          }

          pull_json="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(printf '%s' "$pull_json" | jq -r '.merged')" = "true"
          test "$(printf '%s' "$pull_json" | jq -r '.merge_commit_sha')" = "$TARGET_SHA"
          preview_sha="$(printf '%s' "$pull_json" | jq -r '.head.sha')"
          [[ "$preview_sha" =~ ^[0-9a-f]{40}$ ]]

          staging_run="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_EVIDENCE_RUN_ID")"
          test "$(printf '%s' "$staging_run" | jq -r '.conclusion')" = "success"
          test "$(printf '%s' "$staging_run" | jq -r '.head_branch')" = "main"
          test "$(printf '%s' "$staging_run" | jq -r '.head_sha')" = "$TARGET_SHA"
          staging_artifacts="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_EVIDENCE_RUN_ID/artifacts")"
          for gate in g3 g4 g5 g6 g7 g8 g9 g10 g11; do
            id="$(artifact_id "$staging_artifacts" "$gate-staging-evidence-$TARGET_SHA")"
            [[ "$id" =~ ^[0-9]+$ ]]
          done
          staging_artifact_id="$(artifact_id "$staging_artifacts" "g11-staging-evidence-$TARGET_SHA")"
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$staging_artifact_id/zip" \
            -o "$RUNNER_TEMP/g11-staging.zip"
          unzip -p "$RUNNER_TEMP/g11-staging.zip" > "$RUNNER_TEMP/g11-staging.env"
          test -s "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "STAGING_SOURCE_SHA=$TARGET_SHA" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "EXPECTED_STAGING_SHA=$TARGET_SHA" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "DEPLOYED_STAGING_SHA=$TARGET_SHA" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "STAGING_EXACT_SHA=PASS" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "G11_SCHEMA=PASS" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "SERVICE_ORDER_STATE_MACHINE=PASS" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "INTERACTION_APPEND_ONLY=PASS" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "LAB_SERVICE_ORDER_SOURCE=PASS" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "CUSTOMER_DIRECTORY_SOURCE=PASS" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "G3_G10_REGRESSION=PASS" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "PRODUCTION_PROMOTION_PERFORMED=NO" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "PRODUCTION_MIGRATION_PERFORMED=NO" "$RUNNER_TEMP/g11-staging.env"
          grep -Fx "PRODUCTION_DATA_MUTATED=NO" "$RUNNER_TEMP/g11-staging.env"

          preview_run="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PREVIEW_EVIDENCE_RUN_ID")"
          test "$(printf '%s' "$preview_run" | jq -r '.conclusion')" = "success"
          test "$(printf '%s' "$preview_run" | jq -r '.head_sha')" = "$preview_sha"
          preview_artifacts="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PREVIEW_EVIDENCE_RUN_ID/artifacts")"
          for gate in g3 g4 g5 g6 g7 g8 g9 g10 g11; do
            id="$(artifact_id "$preview_artifacts" "$gate-preview-evidence-$preview_sha")"
            [[ "$id" =~ ^[0-9]+$ ]]
          done
          preview_artifact_id="$(artifact_id "$preview_artifacts" "g11-preview-evidence-$preview_sha")"
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$preview_artifact_id/zip" \
            -o "$RUNNER_TEMP/g11-preview.zip"
          unzip -p "$RUNNER_TEMP/g11-preview.zip" > "$RUNNER_TEMP/g11-preview.env"
          test -s "$RUNNER_TEMP/g11-preview.env"
          grep -Fx "PR_SOURCE_SHA=$preview_sha" "$RUNNER_TEMP/g11-preview.env"
          grep -Fx "PREVIEW_DEPLOYED_SHA=$preview_sha" "$RUNNER_TEMP/g11-preview.env"
          grep -Fx "PREVIEW_EXACT_SHA=PASS" "$RUNNER_TEMP/g11-preview.env"
          grep -Fx "AUTHENTICATED_PREVIEW=PASS" "$RUNNER_TEMP/g11-preview.env"
          grep -Fx "LAB_SERVICES_API_ACCEPTANCE=PASS" "$RUNNER_TEMP/g11-preview.env"
          grep -Fx "LAB_SERVICES_UI_ACCEPTANCE=PASS" "$RUNNER_TEMP/g11-preview.env"
          grep -Fx "G3_G10_REGRESSION=PASS" "$RUNNER_TEMP/g11-preview.env"
          grep -Fx "PRODUCTION_MUTATED=NO" "$RUNNER_TEMP/g11-preview.env"

          echo "tag_name=g11-v1.0-accepted-${TARGET_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create immutable annotated Gate 11 acceptance tag
        env:
          TAG_NAME: ${{ steps.evidence.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" "origin/main"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
            test "$(git cat-file -t "refs/tags/$TAG_NAME")" = "tag"
            test "$(git rev-parse "refs/tags/$TAG_NAME^{}")" = "$TARGET_SHA"
            echo "Existing immutable G11 acceptance tag verified at $TARGET_SHA."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" \
            -m "NØX-OS Gate 11 accepted Staging SHA $TARGET_SHA"
          git push origin "refs/tags/$TAG_NAME"
          test "$(git cat-file -t "refs/tags/$TAG_NAME")" = "tag"
          test "$(git rev-parse "refs/tags/$TAG_NAME^{}")" = "$TARGET_SHA"
