name: production-promotion

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable staging-accepted SHA to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nox-os-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate immutable promotion SHA
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - run: test "$NOX_STAGING_ACCEPTED_SHA" = "$SOURCE_SHA"
        env:
          NOX_STAGING_ACCEPTED_SHA: ${{ vars.NOX_STAGING_ACCEPTED_SHA }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm contracts:check-frozen-inputs
        env:
          CANONICAL_CONTRACT_ROOT: ${{ vars.CANONICAL_CONTRACT_ROOT }}
          REQUIRE_EXTERNAL_CONTRACTS: "true"
      - run: pnpm db:migrate:cloud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          NOX_MIGRATION_ENV: production
      - id: deploy
        run: |
          deployment_output="$(pnpm deploy:production)"
          printf '%s\n' "$deployment_output"
          deployment_url="$(printf '%s\n' "$deployment_output" | sed -n 's/^PRODUCTION_DEPLOY_URL=//p' | tail -n 1)"
          test -n "$deployment_url"
          echo "production_url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          EXPECTED_SOURCE_SHA: ${{ env.SOURCE_SHA }}
      - run: pnpm verify:staging
        env:
          NOX_STAGING_URL: ${{ steps.deploy.outputs.production_url }}
          NOX_EXPECTED_ENV: production
          EXPECTED_SOURCE_SHA: ${{ env.SOURCE_SHA }}
