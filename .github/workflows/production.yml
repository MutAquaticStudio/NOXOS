name: production-promotion

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable staging-accepted SHA to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: echo "Production deployment remains approval-gated and must use this exact SHA."
