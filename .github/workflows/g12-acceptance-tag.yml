name: G12 acceptance tag

on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: Exact accepted G12 main runtime SHA
        required: true
        type: string
      staging_run_id:
        description: Successful immutable G12 staging evidence run
        required: true
        type: string
      preview_run_id:
        description: Successful immutable G12 Preview evidence run
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Verify exact accepted runtime ancestry
        env:
          TARGET_SHA: "${{ inputs.runtime_sha }}"
        run: |
          test "$(git rev-parse "$TARGET_SHA")" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - name: Verify immutable evidence references
        env:
          STAGING_RUN: "${{ inputs.staging_run_id }}"
          PREVIEW_RUN: "${{ inputs.preview_run_id }}"
        run: |
          test -n "$STAGING_RUN"
          test -n "$PREVIEW_RUN"
      - name: Verify G12 authority boundaries
        run: |
          test -f packages/project-operations/src/persistence.ts
          test -f packages/database/src/project-operations-store.ts
          test -f supabase/migrations/20260904123249_g12_project_operations.sql
          test "$(rg -c 'create table project_operations\.' supabase/migrations/20260904123249_g12_project_operations.sql)" = 6
          ! rg -q 'create table .*project_phase_status|current_phase_status|percent_complete' supabase/migrations/20260904123249_g12_project_operations.sql
      - name: Create or verify annotated acceptance tag
        env:
          TARGET_SHA: "${{ inputs.runtime_sha }}"
        run: |
          tag="g12-v1.0-accepted-${TARGET_SHA:0:8}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-parse "$tag^{}")" = "$TARGET_SHA"
            test "$(git cat-file -t "$tag")" = tag
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$TARGET_SHA" -m "NØX-OS Gate 12 accepted Staging SHA $TARGET_SHA"
            git push origin "$tag"
          fi
