name: frozen-input-controls

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/contracts/check-pr-frozen-controls.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

  verify-canonical-content:
    runs-on: ubuntu-24.04
    environment: frozen-contracts
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/contracts/check-frozen-inputs.mjs
        env:
          REQUIRE_EXTERNAL_CONTRACTS: "true"
          FROZEN_G0_ARCHITECTURE_GZIP_BASE64: ${{ secrets.FROZEN_G0_ARCHITECTURE_GZIP_BASE64 }}
          FROZEN_UXUI_GUIDELINE_GZIP_BASE64: ${{ secrets.FROZEN_UXUI_GUIDELINE_GZIP_BASE64 }}
