name: g3-acceptance-tag

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact accepted main SHA from the successful G3 Staging run
        required: true
        type: string
      staging_evidence_run_id:
        description: Successful Staging run that uploaded exact-SHA G3 Staging evidence
        required: true
        type: string
      preview_evidence_run_id:
        description: Successful final PR Preview run that uploaded G3 Preview evidence
        required: true
        type: string
      pr_number:
        description: Merged G3 pull request number
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: nox-os-g3-acceptance-tag
  cancel-in-progress: false

jobs:
  create-annotated-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      STAGING_EVIDENCE_RUN_ID: ${{ inputs.staging_evidence_run_id }}
      PREVIEW_EVIDENCE_RUN_ID: ${{ inputs.preview_evidence_run_id }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Validate immutable G3 Preview and Staging evidence
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a lowercase full 40-character Git SHA" >&2
            exit 1
          fi
          if ! [[ "$STAGING_EVIDENCE_RUN_ID" =~ ^[0-9]+$ && "$PREVIEW_EVIDENCE_RUN_ID" =~ ^[0-9]+$ && "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Evidence run IDs and PR number must be numeric." >&2
            exit 1
          fi
          api() {
            curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }
          pull_json="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(printf '%s' "$pull_json" | jq -r '.merged')" = "true"
          test "$(printf '%s' "$pull_json" | jq -r '.merge_commit_sha')" = "$TARGET_SHA"
          preview_sha="$(printf '%s' "$pull_json" | jq -r '.head.sha')"
          [[ "$preview_sha" =~ ^[0-9a-f]{40}$ ]]

          staging_run="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_EVIDENCE_RUN_ID")"
          test "$(printf '%s' "$staging_run" | jq -r '.conclusion')" = "success"
          test "$(printf '%s' "$staging_run" | jq -r '.head_branch')" = "main"
          test "$(printf '%s' "$staging_run" | jq -r '.head_sha')" = "$TARGET_SHA"
          staging_artifacts="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_EVIDENCE_RUN_ID/artifacts")"
          printf '%s' "$staging_artifacts" | jq -e --arg name "g3-staging-evidence-$TARGET_SHA" \
            '.artifacts[] | select(.name == $name and .expired == false)' >/dev/null

          preview_run="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PREVIEW_EVIDENCE_RUN_ID")"
          test "$(printf '%s' "$preview_run" | jq -r '.conclusion')" = "success"
          preview_artifacts="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PREVIEW_EVIDENCE_RUN_ID/artifacts")"
          printf '%s' "$preview_artifacts" | jq -e --arg name "g3-preview-evidence-$preview_sha" \
            '.artifacts[] | select(.name == $name and .expired == false)' >/dev/null
          echo "tag_name=g3-v1.0-accepted-${TARGET_SHA:0:8}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Create immutable annotated Gate 3 acceptance tag
        env:
          TAG_NAME: ${{ steps.evidence.outputs.tag_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" "origin/main"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME"; then
            echo "Acceptance tag already exists; refusing to overwrite immutable evidence." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "NØX-OS Gate 3 accepted Staging SHA $TARGET_SHA"
          git push origin "refs/tags/$TAG_NAME"
          test "$(git cat-file -t "refs/tags/$TAG_NAME")" = "tag"
          test "$(git rev-parse "refs/tags/$TAG_NAME^{}")" = "$TARGET_SHA"
