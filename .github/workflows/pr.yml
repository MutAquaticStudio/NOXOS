name: pull-request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nox-oe-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/nox-oe/pyproject.toml
      - run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2.10,<3" "pytest>=8,<10"
      - run: PYTHONPATH=services/nox-oe/src python -m pytest services/nox-oe/tests
      - run: python -m compileall -q services/nox-oe/src

  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check-frozen-inputs
      - run: pnpm architecture:test
      - run: pnpm registry:test
      - run: pnpm ux-contract:test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:validate
      - run: pnpm infra:check
      - run: pnpm build
      - run: pnpm verify:runtime-packages
      - run: pnpm secrets:scan

  browser-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: foundation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  cloud-migration-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: foundation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset --local
      - run: pnpm exec supabase test db
      - name: Platform revision transaction and conflict probes
        run: pnpm exec vitest run packages/database/src/platform-revision.postgres.test.ts
        env:
          G2_REVISION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: G4 creation transaction and replay probes
        run: pnpm exec vitest run packages/database/src/design-studio-creation.postgres.test.ts
        env:
          # Disposable Supabase CLI database on this CI runner, never a provider project.
          G4_CREATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: G4 G5 commit evidence and revision replay probes
        run: pnpm exec vitest run packages/database/src/design-studio-evidence.postgres.test.ts
        env:
          G4_EVIDENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: G12 Project revision and replay probes
        run: pnpm exec vitest run packages/database/src/project-command.postgres.test.ts
        env:
          G12_COMMAND_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Commercial fulfillment transaction and replay probes
        run: pnpm exec vitest run packages/database/src/commercial-fulfillment-lines.postgres.test.ts
        env:
          G13_FULFILLMENT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - if: always()
        run: pnpm exec supabase stop --no-backup
